[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experiments"
version = "0.1.0"
description = "Layer C — Comparison framework"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pricing",
    "ai_pricing",
    "ai_hedging",
]

[tool.setuptools.packages.find]
where = ["src"]
