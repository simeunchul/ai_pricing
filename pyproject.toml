[project]
name = "quant-lab"
version = "0.1.0"
description = "Classical + AI Pricing & Hedging monorepo (Hanwha Investment & Securities portfolio)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "simeunchul" }]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.5",
    "pre-commit>=3.0",
]
ml = [
    "torch>=2.0",
    "scikit-learn>=1.3",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]
news = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "transformers>=4.35",
]
market = [
    "pykrx>=1.0",
    "yfinance>=0.2",
]
all = [
    "torch>=2.0",
    "scikit-learn>=1.3",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "transformers>=4.35",
    "pykrx>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
]

[tool.uv.workspace]
members = [
    "packages/pricing",
    "packages/ai_pricing",
    "packages/ai_hedging",
    "packages/experiments",
    "packages/autotrader",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-ra --tb=short --import-mode=importlib"
filterwarnings = ["ignore::DeprecationWarning"]
